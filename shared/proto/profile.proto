syntax = "proto3";

package qa.profile.v1;

// User identity belongs to Auth. This service owns personal profile fields.
service ProfileService {
  rpc GetProfile(GetProfileRequest) returns (Profile);
  rpc UpdateProfile(UpdateProfileRequest) returns (Profile);
}

message GetProfileRequest {
  string user_id = 1;
}

message Profile {
  string user_id = 1;
  string first_name = 2;
  string last_name = 3;
  // ISO date YYYY-MM-DD; empty string means not specified.
  string birth_date = 4;
  string city = 5;
  string description = 6;
  string country = 7;
  string created_at = 8;
  string updated_at = 9;
}

// Absent fields stay unchanged. Explicit empty strings clear fields.
message UpdateProfileRequest {
  string user_id = 1;
  optional string first_name = 2;
  optional string last_name = 3;
  optional string birth_date = 4;
  optional string city = 5;
  optional string description = 6;
  optional string country = 7;
}
