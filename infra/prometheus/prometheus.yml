global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: auth-service
    static_configs: [{targets: ["auth-service:8000"]}]
  - job_name: notification-service
    static_configs: [{targets: ["notification-service:8001"]}]
  - job_name: statistics-service
    static_configs: [{targets: ["statistics-service:8002"]}]
