name: microservices-qa-lab

services:
  kafka:
    image: apache/kafka:3.8.1
    hostname: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      kafka: {condition: service_healthy}
    command: ["/bin/sh", "-c", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic user.registered.v1 --partitions 3 --replication-factor 1 && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic user.registered.dlq.v1 --partitions 3 --replication-factor 1"]
    restart: "no"

  auth-service:
    build: {context: ., dockerfile: services/auth-service/Dockerfile}
    ports: ["8000:8000"]
    environment:
      DATABASE_PATH: /data/auth.db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-change-me}
      DEMO_MODE: ${DEMO_MODE:-true}
      CORS_ORIGINS: http://localhost:5173
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes: ["./data:/data"]
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  notification-service:
    build: {context: ., dockerfile: services/notification-service/Dockerfile}
    ports: ["8001:8001"]
    environment:
      DATABASE_PATH: /data/notifications.db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      DEMO_MODE: ${DEMO_MODE:-true}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes: ["./data:/data"]
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      mailpit: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  statistics-service:
    build: {context: ., dockerfile: services/statistics-service/Dockerfile}
    ports: ["8002:8002"]
    environment:
      DATABASE_PATH: /data/statistics.db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DEMO_MODE: ${DEMO_MODE:-true}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes: ["./data:/data"]
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      args: {VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8000}"}
    ports: ["5173:80"]
    depends_on:
      auth-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.20.4
    ports: ["8025:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: qa-lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka: {condition: service_healthy}
    restart: unless-stopped

  prometheus:
    build: ./infra/prometheus
    ports: ["9090:9090"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    restart: unless-stopped

  loki:
    build: ./infra/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    restart: unless-stopped

  promtail:
    build: ./infra/promtail
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    restart: unless-stopped

  grafana:
    build: ./infra/grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on: [prometheus, loki]
    restart: unless-stopped

  sqlite-web-auth:
    build: ./infra/sqlite-web
    ports: ["8085:8080"]
    volumes: ["./data:/data"]
    command: ["/bin/sh", "-c", "until [ -f /data/auth.db ]; do sleep 1; done; exec sqlite_web --host 0.0.0.0 --port 8080 --read-only /data/auth.db"]
    depends_on:
      auth-service: {condition: service_healthy}
    restart: unless-stopped

  sqlite-web-statistics:
    build: ./infra/sqlite-web
    ports: ["8086:8080"]
    volumes: ["./data:/data"]
    command: ["/bin/sh", "-c", "until [ -f /data/statistics.db ]; do sleep 1; done; exec sqlite_web --host 0.0.0.0 --port 8080 --read-only /data/statistics.db"]
    depends_on:
      statistics-service: {condition: service_healthy}
    restart: unless-stopped
